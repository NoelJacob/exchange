version: "3.8"

volumes:
  minio-data:

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - infra-redpanda-1:9092

  questdb:
    image: questdb/questdb:latest
    ports:
      - "9000:9000"
      - "8812:8812"

  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  runner:
    build: ../infra/runner

  telemetry-ingester:
    build: ../telemetry-ingester
    environment:
      - QUESTDB_URL=questdb:8812
      - REDIS_URL=valkey:6379
      - REDPANDA_BROKERS=redpanda:9092
      - RUST_LOG=info
    dns:
      - 127.0.0.11
    depends_on:
      - redpanda
      - questdb
      - valkey

  platform-api:
    build: ../platform-api
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - QUESTDB_URL=questdb:8812
      - REDIS_URL=redis://valkey:6379
      - JWT_SECRET=dev-secret
      - MINIO_URL=http://minio:9000
      - MINIO_BUCKET=contestant-binaries
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - ADMIN_PASSWORD=admin123
      - INTERNAL_TOKEN=shared-secret-token
      - RUNNER_IMAGE=infra-runner:latest
    depends_on:
      - questdb
      - valkey
      - redpanda
      - minio

  bot-worker:
    build: ../bot-worker
    profiles:
      - build-only
