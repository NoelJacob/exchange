[package]
name = "contestant-sample"
version = "0.1.0"
edition = "2021"

[dependencies]
orderbook-rs = "0.8"
fixer = "0.10.3"
fixer-fix = "0.10.3"
simple-error = "0.3"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
sha2 = "0.11"
pricelevel = "0.7"
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
rand = { version = "0.8", features = ["small_rng"] }


[features]
default = []
prefilled = []
panic_10s = []
slow_submit = []
randomize_price = []