version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackathon
      POSTGRES_DB: hackathon
      POSTGRES_PASSWORD: hackathon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready"], interval: 5s }
    deploy:
      resources:
        limits: { memory: "1g" }
        reservations: { memory: "512m" }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    sysctls: [net.core.somaxconn=1024]
    deploy:
      resources:
        limits: { memory: "1g" }

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
    deploy:
      resources:
        limits: { memory: "512m" }

  submission-api:
    build: services/submission-api
    ports: ["3000:3000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [redis, postgres, minio]
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      DATABASE_URL: postgres://hackathon:hackathon@postgres/hackathon
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      MC_HOST_MYMINIO: http://minioadmin:minioadmin@minio:9000
    deploy:
      replicas: 1
      resources:
        limits: { memory: "512m" }

  telemetry-ingester:
    build: services/telemetry-ingester
    ports: ["3001:3001"]
    depends_on: [redis, postgres]
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://hackathon:hackathon@postgres/hackathon
      WS_PORT: "3001"
    deploy:
      replicas: 1
      resources:
        limits: { memory: "512m" }

  portal:
    build: services/portal
    ports: ["8080:80"]
    depends_on: [submission-api, telemetry-ingester]
    deploy:
      resources:
        limits: { memory: "256m" }

  bot-worker:
    build: services/bot-worker
    profiles: [manual]
    depends_on: [redis]
    deploy:
      replicas: 0
      resources:
        limits: { cpus: "1", memory: "256m" }

volumes:
  pgdata:
  redis-data:
  minio-data:
