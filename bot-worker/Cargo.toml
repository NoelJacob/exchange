[package]
name = "bot-worker"
version = "0.1.0"
edition = "2021"

[dependencies]
fixer = "0.10.3"
fixer-fix = "0.10.3"
simple-error = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"
chrono = { version = "0.4", features = ["now"] }
clap = { version = "4", features = ["derive"] }
rskafka = "0.6"
