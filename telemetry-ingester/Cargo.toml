[package]
name = "telemetry-ingester"
version = "0.1.0"
edition = "2021"

[dependencies]
orderbook-rs = "0.8"
pricelevel = "0.7"
futures = "0.3"
rskafka = "0.6"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "chrono"] }
fred = "10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
